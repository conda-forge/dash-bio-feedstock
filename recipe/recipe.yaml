# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: dash-bio
  version: 1.0.2
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dash_bio-${{ version }}.tar.gz
  sha256: 6de28e412a37aef19429579f3285c27a5d4f21d8f387564d0698d63466259a36

build:
  number: 1
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - dash >=1.6.1
    - dash-core-components
    - dash-html-components
    - dash-table
    - pandas
    - scipy
    - scikit-learn >=0.20.1
    - biopython >=1.77
    - colour
    - geoparse >=1.1.0
    - jsonschema
    - parmed
    - periodictable
    - requests
    - typing_extensions

tests:
  - python:
      imports:
        - dash_bio
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: http://github.com/plotly/dash-bio
  summary: Dash components for bioinformatics
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - asford
